name: Visual regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

jobs:
  playwright-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact_ci_only
          POSTGRES_DB: pact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pact -d pact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PACT_ENV: development
      PACT_DEV_PERSONAS: "true"
      PACT_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      PACT_DATABASE_URL: postgresql+psycopg://pact:pact_ci_only@127.0.0.1:5432/pact
      PACT_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pact-api.log 2>&1 &
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Compare Linux baselines
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
