services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports: ["127.0.0.1:3310:3310"]
    volumes: [clamav_signatures:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  release-worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    command: ["python", "-m", "app.scheduler_worker"]
    restart: unless-stopped
    env_file: [.env.staging]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import get_engine;from sqlalchemy import text;get_engine().connect().execute(text('select 1'))"]
      interval: 30s
      timeout: 10s
      retries: 3
  scan-worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    command: ["python", "-m", "app.scan_worker"]
    restart: unless-stopped
    env_file: [.env.staging]
    environment: {PACT_CLAMAV_HOST: clamav}
    depends_on:
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('clamav',3310),5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
  digest-worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    command: ["python", "-m", "app.digest_worker"]
    restart: unless-stopped
    env_file: [.env.staging]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import get_engine;from sqlalchemy import text;get_engine().connect().execute(text('select 1'))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes: {clamav_signatures: {}}
