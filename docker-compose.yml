# Local development services only. Synthetic data. Not for deployment.
services:
  db:
    image: postgres:16.4-alpine
    container_name: pact-db
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: ${PACT_DB_PASSWORD:-pact_dev_only}
      POSTGRES_DB: pact
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pact_pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 3s
      timeout: 3s
      retries: 20
  release-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      PACT_ENV: development
      PACT_DATABASE_URL: postgresql+psycopg://pact:${PACT_DB_PASSWORD:-pact_dev_only}@db:5432/pact
      PACT_SESSION_SECRET: ${PACT_SESSION_SECRET:-development-worker-session-secret-32-characters}
      PACT_SCHEDULER_INTERVAL_SECONDS: 30
    depends_on:
      db:
        condition: service_healthy
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  scan-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "app.scan_worker"]
    restart: unless-stopped
    environment:
      PACT_ENV: development
      PACT_DATABASE_URL: postgresql+psycopg://pact:${PACT_DB_PASSWORD:-pact_dev_only}@db:5432/pact
      PACT_SESSION_SECRET: ${PACT_SESSION_SECRET:-development-worker-session-secret-32-characters}
      PACT_CLAMAV_HOST: clamav
      PACT_OBJECT_STORAGE_PROVIDER: filesystem
      PACT_OBJECT_STORAGE_DIRECTORY: /data/protected-documents
    volumes:
      - ./.data/protected-documents:/data/protected-documents
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('clamav',3310),5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pact_pgdata:
  clamav_signatures:
